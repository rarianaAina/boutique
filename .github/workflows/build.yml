name: Build

# Deux raisons d'exister :
#  1. compiler l'application sur Windows, ce qu'aucun poste Linux ne peut faire ;
#  2. produire les installeurs sans dépendre de la machine d'un développeur.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rapide et indépendant de la plateforme : inutile de mobiliser deux runners
  # pour découvrir qu'un test échoue.
  verify:
    name: Types et tests
    runs-on: ubuntu-latest

    # Le schéma Postgres est TRADUIT du SQLite, et l'épreuve de conformité
    # vérifie que les deux structures restent identiques — la promesse sur
    # laquelle repose la migration d'un commerçant hors ligne vers l'offre en
    # ligne. Elle se saute d'elle-même sans base, ce qui garderait la suite
    # locale rapide mais laisserait la garantie sans effet : on la fournit ici.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: conformite
          POSTGRES_DB: boutique
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Aucune version ici : elle est déclarée une seule fois, dans le champ
      # `packageManager` de package.json. La donner aux deux endroits fait
      # échouer l'action sur « Multiple versions of pnpm specified ».
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Le paquet partagé est consommé depuis ses sources par l'application ;
      # le compiler quand même valide l'émission des déclarations, qui attrape
      # des types que `--noEmit` laisse passer.
      - run: pnpm --filter @boutique/shared build

      - run: pnpm -r typecheck

      # Les tests des dépôts tournent sur une VRAIE base SQLite, avec le schéma
      # de production : ils éprouvent donc aussi les contraintes d'unicité, qui
      # sont l'essentiel de la protection des IMEI.
      - run: pnpm -r test
        env:
          DATABASE_URL: postgres://postgres:conformite@127.0.0.1:5432/boutique

      - run: pnpm exec prettier --check .

      # La compilation du front est le seul moyen de savoir que les écrans
      # passent encore, indépendamment de la production d'un installeur.
      - run: pnpm --filter @boutique/desktop build

  # Le code Rust porte les écritures transactionnelles et les sauvegardes :
  # deux choses dont une régression se paierait en données perdues.
  rust:
    name: Rust — format, lints, compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WebKitGTK et les bibliothèques GTK ne sont pas préinstallées sur les
      # runners Ubuntu.
      - name: Dépendances système de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Le cache Rust divise le temps de compilation par cinq sur les
      # exécutions suivantes ; sans lui, chaque poussée recompile 400 caisses.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # `tauri-build` a besoin du dossier de la compilation front. Il n'est pas
      # versionné : on le crée vide, la compilation Rust n'en lit pas le contenu.
      - run: mkdir -p apps/desktop/dist

      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri

      # `-D warnings` : un avertissement toléré aujourd'hui est un avertissement
      # ignoré pour toujours.
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

  build:
    name: ${{ matrix.label }}
    needs: [verify, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: boutique-windows
          - os: ubuntu-22.04
            label: Linux
            artifact: boutique-linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Dépendances système (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            file

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @boutique/shared build

      - name: Compilation de l'application
        run: pnpm --filter @boutique/desktop tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  # ── Android ───────────────────────────────────────────────────────────────
  #
  # Tauri sait viser Android : la MÊME application, la même base SQLite, le
  # même code — seulement rendue dans la WebView du système au lieu de celle du
  # bureau. Il n'y a rien à réécrire, ce qui n'aurait pas été le cas d'un
  # portage React Native.
  #
  # ELLE NE BLOQUE NI LES INSTALLEURS NI LA PUBLICATION : `continue-on-error`.
  # La chaîne Android est la plus fragile des trois — quatre cibles Rust, un
  # NDK, Gradle — et une panne de sa part ne doit pas priver un commerçant de
  # sa mise à jour Windows.
  #
  # L'APK est signé avec la clé de DÉBOGAGE d'Android : il s'installe en
  # autorisant les « sources inconnues », ce qui convient à une distribution
  # directe. Une publication sur le Play Store demanderait une vraie clé, à
  # ranger dans les secrets du dépôt.
  android:
    name: Android (APK)
    needs: [verify, rust]
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: NDK
        run: |
          sdkmanager --install "ndk;27.1.12297006"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      # LES DEUX ARCHITECTURES ARM, et pas les quatre. Les x86 ne servent qu'aux
      # émulateurs : les embarquer doublait le temps de compilation et pesait
      # sur un fichier que le commerçant télécharge en 3G.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: android

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @boutique/shared build

      # Le projet Gradle est ENGENDRÉ à chaque fois plutôt que versionné : c'est
      # un dossier de plusieurs centaines de fichiers que personne ne relit, et
      # qui se désynchroniserait de la configuration Tauri sans qu'on le voie.
      - name: Préparation du projet Android
        run: pnpm --filter @boutique/desktop tauri android init --ci --skip-targets-install

      # UN APK PAR ARCHITECTURE. Le paquet unique pesait cent cinquante-six
      # mégaoctets parce qu'il portait le code machine de toutes les
      # architectures à la fois ; découpé, chacun tient dans le tiers. Presque
      # tous les appareils d'aujourd'hui prennent `arm64-v8a`.
      - name: Compilation des APK
        run: >-
          pnpm --filter @boutique/desktop tauri android build
          --apk --debug --split-per-abi --target aarch64 armv7

      - uses: actions/upload-artifact@v4
        with:
          name: boutique-android
          retention-days: 14
          if-no-files-found: error
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    name: Publication
    if: startsWith(github.ref, 'refs/tags/v')
    # Android est inclus pour que l'APK soit prêt au moment de la publication.
    # Sa tâche est en `continue-on-error` : si elle échoue, la publication a
    # tout de même lieu, avec les seuls installeurs de bureau.
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: boutique-*

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          # Brouillon volontaire : les installeurs ne sont pas signés par un
          # certificat éditeur, il faut relire ce qu'on publie avant de
          # l'exposer.
          body: |
            Installeurs Windows et Linux, et APK Android, de l'application
            Boutique.

            La base locale est migrée automatiquement au premier démarrage :
            aucune manipulation n'est nécessaire sur les postes déjà installés.

            ⚠️ Installeurs non signés par un certificat éditeur : Windows
            affichera un avertissement SmartScreen à la première installation
            (« Plus d'infos » puis « Exécuter quand même »).

            ⚠️ L'APK est signé avec la clé de débogage d'Android : il faut
            autoriser l'installation depuis une « source inconnue ». Il vise
            une TABLETTE — l'interface est dessinée pour un écran large et
            reste à l'étroit sur un téléphone.
